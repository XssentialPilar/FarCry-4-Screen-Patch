; Far Cry 4 Universal Aspect Ratio & Adaptive UI Patch (V2 - Zero .text Modification)
; Zero black bars, zero stretching/distortion, zero cropping across any aspect ratio
; (4:3, 5:4, 4:5, 3:2, 16:10, 16:9, 1.85:1, 2:1, 21:9, 2.35/2.39/2.40:1, 2.76:1, 9:16, 18:9, 19.5:1, 20:9, etc.)

[General]
Enabled=1

[BlackBars]
; Normalizes viewport rectangles to full {0,0,W-1,H-1}, disables 2.2:1 split, static black bars, and multimonitor blackout quads
DisableBlackBars=1
; Disables scripted/cutscene black bar fade-ins (set to 0 if you want cutscene black bars preserved)
DisableCinematicBlackBars=1

[UI]
; Applies uniform 9-point full-screen proportional UI anchor scaling directly on live Scaleform objects
AdaptiveUI=1

[FOV]
; Dynamically switches native engine FOV between Vert+ (<= 16:9) and Hor+ (> 16:9)
FixFOV=1

[Display]
; Removes the video options aspect-ratio resolution filter via heap VTable hook
UnlockResolutions=1
