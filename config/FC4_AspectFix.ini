[General]
; Enable or disable the entire patch (1 = enabled, 0 = disabled)
Enabled=1
; Optional verbose UI/video diagnostic logging (0 = off, 1 = on)
DiagnosticLog=0

[BlackBars]
; Remove static 16:9 letterbox/pillarbox and ultrawide black bars across all aspect ratios
DisableBlackBars=1
; Remove 2.35:1 cinematic black bars during cutscenes
DisableCinematicBlackBars=1

[UI]
; Adapt HUD, Pause Menu, Shop, World Map, Loading Screen, and Press Any Key to full viewport
; Backgrounds use aspect-preserving Cover-Fit; UI panels and HUD remain distortion-free
AdaptiveUI=1

[FOV]
; Automatically switch between native Hor+ (>16:9) and native Vert+ (<=16:9)
FixFOV=1

[Display]
; Unlock all display resolutions regardless of aspect-ratio filter in Video Options
UnlockResolutions=1

[Video]
; Expand pre-recorded Bink videos (intro, main menu background, cutscenes) using Cover-Fit
; (removes black bars without stretching or distorting proportions)
FixVideoAspectRatio=1
; Allow skipping non-looping pre-recorded videos independently by pressing any key/button
; (Press F8 in-game at any time to toggle ON/OFF; never skips looping menu backgrounds)
SkipPreRecordedVideos=1
; Show a discrete native prompt while a skippable pre-recorded video is playing
ShowSkipPrompt=1
